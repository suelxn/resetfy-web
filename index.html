<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESETFY - Timer de Concentração</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Aplica o tema salvo antes da primeira pintura (evita flash). Mesma regra de src/utils/theme.ts -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <!-- Container raiz: todos os componentes visuais serão renderizados aqui -->
    <div id="app"></div>
    <!-- Script de entrada: inicializa a aplicação -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
